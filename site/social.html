<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Social Media Check · MindMender</title>
  <link rel="icon" href="img/logo.png">
  <meta name="updated" content="2026-10-06">
  <link rel="stylesheet" href="style.css">
  <script src="boot.js"></script>
</head>
<body>
  <header></header>
  <main>
    <h1>Social media &amp; mental health check</h1>
    <p class="muted">13 questions about how social media fits into your life, covering attention, anxiety, self-esteem and mood. The questions come from a 2022 survey study on social media and mental health. It's a self-check, not a diagnosis.</p>
    <form id="form">
      <div id="questions"></div>
      <button>See my result</button>
    </form>
    <div id="result" class="card" hidden aria-live="polite"></div>
    <div class="card">
      <h2>Past results</h2>
      <ul id="past"></ul>
    </div>
  </main>
  <script type="module">
    import { requireLogin, questionnaire, save, history, LOADING, LOAD_ERROR } from './app.js';
    import { busy } from './ui.js';
    import { SM_QUESTIONS, SM_OPTIONS, SM_TIME_OPTIONS, SM_AREA_MAX, smScore } from './scoring.js';
    await requireLogin();

    const LABELS = { adhd: 'Attention & focus', anxiety: 'Anxiety', selfEsteem: 'Self-esteem', depression: 'Low mood' };
    const answers = questionnaire(document.getElementById('questions'),
      [['On average, how much time do you spend on social media each day?', SM_TIME_OPTIONS], ...SM_QUESTIONS], SM_OPTIONS);
    const past = document.getElementById('past');

    async function showHistory() {
      past.innerHTML = LOADING;
      let rows;
      try { rows = await history('social', 10); } catch { past.innerHTML = LOAD_ERROR; return; }
      past.innerHTML = rows.length
        ? rows.map((r) => `<li>${new Date(r.ts).toLocaleDateString()}: <strong>${r.total}/59</strong>${r.checkup ? ' (checkup suggested)' : ''}</li>`).join('')
        : '<li class="muted">No results yet.</li>';
    }

    document.getElementById('form').onsubmit = async (e) => {
      e.preventDefault();
      const [time, ...rest] = answers();
      const { areas, total, checkup } = smScore(rest.map((a) => a + 1));
      const result = document.getElementById('result');
      result.hidden = false;
      result.innerHTML = `<h2>Your score: ${total} / 59</h2>`
        + Object.entries(areas).map(([k, v]) =>
          `<label>${LABELS[k]}: ${v} / ${SM_AREA_MAX[k]}<meter value="${v}" max="${SM_AREA_MAX[k]}"></meter></label>`).join('')
        + (checkup
          ? '<p>Your answers suggest you may be dealing with noticeable symptoms. We recommend <strong>talking to a mental health professional</strong> for a proper check-up. If you ever feel unsafe, call Tele-MANAS 14416 (India) or 988 (US).</p>'
          : '<p>Your answers don\'t point to severe symptoms. Keep an eye on the areas that scored higher.</p>')
        + (time >= 3
          ? '<p class="muted">You spend 3+ hours a day on social media. If that feels like a lot, a short break or <a href="relax.html">breathing exercise</a> might help.</p>'
          : '');
      result.insertAdjacentHTML('beforeend', '<div class="actions"><button type="button" class="secondary" onclick="print()">Print or save as PDF</button></div>');
      result.scrollIntoView({ behavior: 'smooth' });
      await busy(e.submitter, () => save('social', { total, checkup, areas, time })).catch(() => {});
      showHistory();
    };
    showHistory();
  </script>
</body>
</html>
