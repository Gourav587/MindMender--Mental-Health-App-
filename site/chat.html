<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat · MindMender</title>
  <link rel="icon" href="img/logo.png">
  <meta name="updated" content="2026-10-06">
  <link rel="stylesheet" href="style.css">
  <script src="boot.js"></script>
</head>
<body>
  <header></header>
  <main>
    <h1>Chat</h1>
    <p class="muted">An AI listener, not a therapist. It can get things wrong. Your messages aren't saved by MindMender, but avoid sharing details like your full name or address.</p>
    <div id="messages" aria-live="polite">
      <div class="msg bot">Hi, I'm here to listen. What's on your mind today?</div>
    </div>
    <form id="chat-form">
      <input id="input" aria-label="Your message" placeholder="Type how you're feeling…" maxlength="2000" autocomplete="off">
      <button id="send">Send</button>
    </form>
    <div class="actions"><button type="button" id="clear" class="secondary">Clear chat</button></div>
  </main>
  <script type="module">
    import { requireLogin } from './app.js';
    import { copyButton, confirmDialog } from './ui.js';
    const user = await requireLogin();
    fetch('/chat').catch(() => {}); // wakes the chat server while you type
    const ERRORS = {
      401: 'Your login has run out. Please refresh the page and log in again.',
      429: 'You’re sending messages quickly. Take a breath, then try again in a minute.',
      504: 'The chat was still waking up. Please send your message again.',
    };

    const messages = document.getElementById('messages');
    const input = document.getElementById('input');
    const send = document.getElementById('send');

    function add(text, who) {
      const div = document.createElement('div');
      div.className = 'msg ' + who;
      div.textContent = text;
      messages.append(div);
      div.scrollIntoView({ block: 'end' });
      return div;
    }

    document.getElementById('chat-form').onsubmit = async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      add(message, 'me');
      input.value = '';
      send.disabled = true;
      const pending = add('', 'bot');
      pending.innerHTML = '<span class="typing" aria-label="MindMender is typing"><span></span><span></span><span></span></span>';
      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + await user.getIdToken() },
          body: JSON.stringify({ message }),
        });
        if (!res.ok) throw new Error(res.status);
        const reply = (await res.json()).reply;
        pending.textContent = reply;
        pending.append(copyButton(() => reply));
      } catch (err) {
        pending.classList.add('error');
        pending.textContent = ERRORS[err.message] ?? "Sorry, I couldn't reach the server. Please try again in a moment.";
      }
      send.disabled = false;
      input.focus();
    };

    document.getElementById('clear').onclick = async () => {
      if (await confirmDialog('Clear this conversation from the screen?', 'Clear chat')) {
        messages.replaceChildren(messages.firstElementChild);
        input.focus();
      }
    };
  </script>
</body>
</html>
